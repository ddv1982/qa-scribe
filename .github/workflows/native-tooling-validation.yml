name: Native TypeScript tooling

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - 'frontend/.oxlintrc.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/scripts/**'
      - 'scripts/*native*.mjs'
      - 'scripts/*rust-typescript*.mjs'
      - 'scripts/check-typescript-compiler.mjs'
      - 'scripts/check-release-metadata.mjs'
      - 'scripts/command-utils.mjs'
      - 'scripts/release-constants.json'
      - 'scripts/check-e2e-isolation.mjs'
      - 'scripts/run-e2e.mjs'
      - 'scripts/fixtures/native-tooling/**'
      - '.github/**'
      - '.vscode/**'
      - 'frontend/.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-tooling:
    name: Native tooling (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'macos-arm64' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-26
          - platform: macos-x64
            runner: macos-26-intel
    env:
      NATIVE_TOOLING_PLATFORM: ${{ matrix.platform }}
      NATIVE_TOOLING_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Select isolated cache
        env:
          CACHE_KEY: native-tooling-${{ matrix.platform }}-${{ github.sha }}-${{ hashFiles('frontend/bun.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_DIRECTORY: ${{ runner.temp }}/qa-scribe-native-tooling-cache
        run: |
          echo "NATIVE_TOOLING_CACHE_KEY=$CACHE_KEY" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=$CACHE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Verify cold native installation
        run: node scripts/check-native-tooling-installations.mjs cold

      - name: Save exact native package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ env.NATIVE_TOOLING_CACHE_KEY }}

      - name: Discard local packages and cache
        run: node scripts/check-native-tooling-installations.mjs discard

      - name: Restore exact native package cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ env.NATIVE_TOOLING_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Verify warm native installation
        env:
          NATIVE_TOOLING_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: node scripts/check-native-tooling-installations.mjs warm

      - name: Verify actual macOS Rust editor selection
        if: matrix.platform == 'macos-arm64'
        timeout-minutes: 10
        env:
          NATIVE_EDITOR_SMOKE_OUTPUT: ${{ runner.temp }}/qa-scribe-editor-smoke
        run: node scripts/check-native-editor-smoke.mjs --provision

      - name: Upload actual editor smoke receipts
        if: always() && matrix.platform == 'macos-arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-editor-smoke-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qa-scribe-editor-smoke/*.json
            ${{ runner.temp }}/qa-scribe-editor-smoke/*.jsonl
            ${{ runner.temp }}/qa-scribe-editor-smoke/*.log
            ${{ runner.temp }}/qa-scribe-editor-smoke/*.png
            ${{ runner.temp }}/qa-scribe-editor-smoke/*.txt
            ${{ runner.temp }}/qa-scribe-editor-smoke/root/*.json
            ${{ runner.temp }}/qa-scribe-editor-smoke/root/*.txt
            ${{ runner.temp }}/qa-scribe-editor-smoke/root/*.png
            ${{ runner.temp }}/qa-scribe-editor-smoke/root/profile/logs/**
            ${{ runner.temp }}/qa-scribe-editor-smoke/frontend/*.json
            ${{ runner.temp }}/qa-scribe-editor-smoke/frontend/*.txt
            ${{ runner.temp }}/qa-scribe-editor-smoke/frontend/*.png
            ${{ runner.temp }}/qa-scribe-editor-smoke/frontend/profile/logs/**
          if-no-files-found: error

      - name: Write native tooling summary
        if: always()
        run: node scripts/write-quality-summary.mjs

      - name: Upload native tooling receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-tooling-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-tooling-validation/
          if-no-files-found: error
