name: Validate build
description: >-
  Shared frontend and Rust validation gate used by both the CI quality job and the
  release validate-release job, so the release gate cannot drift from CI.
  Expects checkout, project setup, and Linux Tauri desktop dependencies to be
  provided by the calling workflow.

inputs:
  runner-class:
    description: Stable runner identifier written to E2E and startup metadata.
    required: false
    default: ubuntu-24.04-github-x64
  expected-tag:
    description: >-
      Release tag to validate metadata against. Leave empty to validate metadata
      without tag matching, as CI does.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Read workflow tool versions
      id: workflow-tools
      shell: bash
      run: node scripts/check-workflows.mjs --github-output >> "$GITHUB_OUTPUT"

    - name: Install pinned actionlint
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      with:
        version: ${{ steps.workflow-tools.outputs.actionlint }}
        flags: '-version'

    - name: Lint Workflows
      shell: bash
      run: node scripts/check-workflows.mjs

    - name: Audit GitHub Actions security
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        version: ${{ steps.workflow-tools.outputs.zizmor }}
        online-audits: true
        advanced-security: false
        inputs: .github

    - name: Audit frontend dependencies
      shell: bash
      run: bun run frontend:audit

    - name: Enforce maintained file-size policy
      shell: bash
      run: bun run code-size:check

    - name: Check frontend domain terminology
      shell: bash
      run: bun run terminology:check

    - name: Verify native TypeScript tooling and lint coverage
      shell: bash
      run: bun run frontend:tooling:check

    - name: Verify native TypeScript compiler behavior
      shell: bash
      run: bun run frontend:compiler:check

    - name: Run frontend check
      shell: bash
      run: bun run frontend:check

    - name: Run frontend tests
      shell: bash
      run: bun run frontend:test

    - name: Validate release metadata
      shell: bash
      env:
        EXPECTED_TAG: ${{ inputs.expected-tag }}
      run: |
        if [ -n "${EXPECTED_TAG}" ]; then
          node scripts/check-release-metadata.mjs --expected-tag "${EXPECTED_TAG}"
        else
          node scripts/check-release-metadata.mjs
        fi

    - name: Run release package metadata tests
      shell: bash
      run: bun run linux:metadata:test

    - name: Run release script tests
      shell: bash
      run: bun run release:script-tests

    - name: Build frontend
      shell: bash
      run: bun run frontend:build

    - name: Prove production build excludes E2E bridge
      shell: bash
      run: bun run e2e:isolation

    - name: Validate Tauri prebuilt frontend contract
      shell: bash
      run: bash scripts/check-tauri-prebuilt-frontend.sh

    - name: Check Tauri command bindings
      shell: bash
      run: bun run bindings:check

    - name: Check Tauri command surface
      shell: bash
      run: bun run tauri:commands:check

    - name: Check Rust formatting
      shell: bash
      run: cargo fmt --all --check

    - name: Restore pinned cargo-audit executable
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pinned, same revision as native-tooling-validation
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner-class }}-${{ hashFiles('scripts/tool-versions.json', 'scripts/install-cargo-audit.mjs') }}

    - name: Install cargo-audit
      shell: bash
      run: node scripts/install-cargo-audit.mjs

    - name: Audit Rust dependencies
      shell: bash
      run: bun run rust:audit

    - name: Run Rust tests
      shell: bash
      run: cargo test --workspace

    - name: Run Rust clippy
      shell: bash
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build Rust workspace
      shell: bash
      run: cargo build --workspace

    - name: Smoke test Rust binary
      shell: bash
      run: bun run smoke

    - name: Run Linux built-application quality gate
      uses: $/.github/actions/run-built-app-e2e
      with:
        artifact_prefix: qa-scribe-e2e
        failure_artifact_prefix: qa-scribe-quality-failure
        runner_class: ${{ inputs.runner-class }}
        use_xvfb: 'true'
        run_startup_benchmark: 'true'
