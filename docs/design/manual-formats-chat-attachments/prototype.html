:flex;align-items:center;gap:12px;margin-bottom:12px}.filters .search{max-width:none;background:var(--raised)}.filters button{min-height:36px}.filters small{white-space:nowrap;color:var(--secondary);font-size:11px}.collection{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}.master{padding:8px}.record{padding:12px;border:1px solid transparent;border-radius:8px}.record.chosen{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 36%,var(--border));box-shadow:inset 3px 0 var(--accent)}.record strong{font-size:12px}.record small{display:block;margin-top:8px;color:var(--secondary);font-size:11px}.badge{display:inline-block;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--border));border-radius:999px;background:var(--tint);padding:3px 8px;font-size:10px;margin-top:10px}.editor{padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--raised);min-width:0}.editor-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.editor-title h2{font-size:17px;line-height:1.3;margin:0}.editor-title span{font-size:11px;color:var(--secondary)}.record-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px}.field{display:grid;gap:7px;margin-bottom:14px;font-size:12px;font-weight:550}.field input,select{border:1px solid var(--border);border-radius:6px;background:var(--sunken);padding:8px 10px;height:34px;font-weight:400;min-width:0}.format-row{display:flex;align-items:end;gap:16px;margin-bottom:14px}.format-row .field{width:200px;margin:0;flex:none}.format-row p{margin:0 0 2px;font-size:11px;line-height:1.5;color:var(--secondary)}.toolbar{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;padding:6px 8px;background:var(--panel);min-height:40px}.toolbar button{background:transparent;border:0;min-height:26px;padding:4px 8px;border-radius:4px}.toolbar button:first-child{margin-right:auto;font-size:12px}.toolbar .icon{height:15px;width:15px}.body-editor{border:1px solid var(--border);border-radius:0 0 8px 8px;padding:18px 16px;background:var(--sunken);min-height:292px;height:292px;overflow:auto;line-height:1.5;outline:0}.body-editor h3{font-size:15px;line-height:1.4;margin:0 0 12px}.body-editor h4{font-size:13px;margin:15px 0 5px}.body-editor p{margin:5px 0 13px;font-size:12px}.body-editor ul,.body-editor ol{padding-left:20px;margin:8px 0 12px;font-size:12px}.body-editor li{margin:6px 0}.body-editor .placeholder{color:var(--muted)}.optional{border-top:1px solid var(--border);padding-top:16px;margin-top:18px}.optional h3{font-size:13px;margin:0 0 6px}.optional p{color:var(--secondary);font-size:11px;margin:0 0 12px}.optional .buttons{justify-content:flex-end}.finding-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.finding-fields .field{min-width:0}.chatmode{display:flex;gap:8px;margin:0 0 16px}.chat-card{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:24px;display:flex;flex-direction:column;min-height:620px}.chat-card h1{font-size:24px;margin-bottom:22px}.chat-topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.chat-topline h2{font-size:15px;margin:0 0 6px}.chat-topline p{margin:0;color:var(--secondary);font-size:12px}.chat-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--secondary);margin:16px 0 12px}.chat-meta .saved{margin-left:auto;display:flex;align-items:center;gap:5px}.chat-meta .saved .icon{width:13px;height:13px;color:var(--green)}.transcript{border:1px solid var(--border);border-radius:8px;padding:16px;min-height:185px;display:flex;flex-direction:column;gap:16px}.message{display:grid;grid-template-columns:24px 1fr;gap:10px}.avatar{border:1px solid var(--border);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;font-size:11px;background:var(--sunken);color:var(--secondary)}.avatar.ai{color:var(--accent);background:var(--tint)}.message strong{font-size:12px}.message p{font-size:13px;line-height:1.6;margin:5px 0}.chat-count{font-size:11px;color:var(--muted);margin:9px 0 14px}.modelrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12px}.modelrow .label{display:grid;gap:4px;color:var(--secondary)}.modelrow .label strong{color:var(--text)}.modelrow button{margin-left:auto}.handoff{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px;margin-bottom:18px;gap:12px;color:var(--secondary);font-size:11px}.compose{margin-top:auto}.compose>label{font-weight:550;font-size:12px;display:block;margin-bottom:8px}.compose-box{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--sunken)}.compose-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}textarea{display:block;resize:vertical;width:100%;min-height:48px;background:transparent;border:0;outline:0!important;padding:0;line-height:1.6;font-size:13px}.attachments{display:flex;gap:10px;margin-bottom:12px}.attachment{display:flex;align-items:center;gap:10px;padding:6px;background:var(--raised);border:1px solid var(--border);border-radius:6px;max-width:300px}.attachment img{width:68px;height:44px;object-fit:cover;border-radius:3px;border:1px solid var(--border)}.attachment>div{min-width:0}.attachment{max-width:100%}.attachment strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;display:block;font-weight:500}.attachment small{font-size:10px;color:var(--secondary);display:block;margin-top:5px}.attachment button{padding:4px;min-height:24px;border:0;background:transparent;margin-left:10px}.attachment button .icon{height:13px;width:13px}.compose-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.compose-actions p{font-size:11px;color:var(--secondary);margin:0;line-height:1.6}.paperclip{height:34px;width:36px;pad <div class="designbar"><span class="tag">DESIGN PREVIEW</span><button data-view="testcase">Manual test cases</button><button data-view="finding">Manual finding</button><button data-view="chat">Chat attachments</button><span class="prototype-notice">Local mockup · Sample content</span><button id="theme" class="quiet" aria-label="Toggle light and dark theme">Light theme</button></div>
<div class="app"><header class="topbar"><div class="brand"><svg class="icon" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6Z M14 5l5 5 M3 21h18"/></svg>QA Scribe</div><div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>Search Sessions…</div><div class="top-actions"><button>⌘&nbsp; Commands <small class="muted">⌘K</small></button><button class="primary">＋ New Session</button></div></header><aside class="sidebar"><div class="nav current"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7Z M14 2v6h5 M8 12h8 M8 16h6"/></svg>Sessions <span class="count">3</span></div><div class="nav"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4C9 2 5 2 2 4v16c3-2 7-2 10 0 3-2 7-2 10 0V4c-3-2-7-2-10 0Z M12 4v16"/></svg>Test cases library</div><div class="nav"><svg class="icon" viewBox="0 0 24 24"><path d="M4 22V3c5-4 9 4 16 0v11c-7 4-11-4-16 0"/></svg>Findings library</div><p class="rail-title">RECENT SESSIONS</p><div class="session">Checkout validation<small>24 okt</small></div><div class="record"><span>Account recovery</span><small>23 okt</small></div><div class="record"><span>Search and filtering</span><small>22 okt</small></div><div class="rail-foot"><button class="quiet">ⓘ Help</button><button class="quiet">⚙ Settings</button></div></aside><main class="workspace"><div class="contextbar"><div class="breadcrumbs"><span>Sessions</span><span>›</span><strong>Checkout validation</strong></div><div class="tabs"><button class="tab" data-tab="chat">▤ Note</button><button class="tab" data-tab="testcase">◇ Test cases <small>2</small></button><button class="tab" data-tab="finding">⚑ Findings <small>1</small></button></div></div><div class="content" id="screen"></div></main></div><div id="modal"></div>
<script>
const icon={clip:'<svg class="icon" viewBox="0 0 24 24"><path d="m21 11-9 9a6 6 0 0 1-8-8L14 2a4 4 0 0 1 6 6L10 18a2 2 0 0 1-3-3l9-9"/></svg>',close:'<svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12 M6 18 18 6"/></svg>',save:'<svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z M7 3v6h10V3 M7 21v-8h10v8"/></svg>',copy:'<svg class="icon" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></svg>',image:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><path d="m21 15-5-5L5 21"/></svg>',check:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'};
const formats=[['qa_cases','QA cases'],['checklist','Checklist'],['gherkin','Gherkin'],['charters','Charters'],['coverage_outline','Coverage outline']];
const starters={qa_cases:'<h3>Scenario</h3><p class="placeholder">Which behavior are you testing?</p><h4>Test case</h4><p class="placeholder">Name the behavior to verify.</p><h4>Purpose</h4><p class="placeholder">What does this case verify?</p><h4>Preconditions</h4><p class="placeholder">Required state and test data.</p><h4>Test data</h4><p class="placeholder">Inputs and example values.</p><h4>Steps</h4><ol><li class="placeholder">Add an executable step.</li></ol><h4>Expected result</h4><p class="placeholder">Describe the observable outcome.</p><h4>Coverage notes</h4><p class="placeholder">Related risks or assumptions.</p>',checklist:'<h3>Checkout checks</h3><p class="placeholder">Write one executable check per item.</p><p>☐ Add a product and verify the cart total.</p><p>☐ Remove a product and verify the total updates.</p><p>☐ Apply a valid discount and verify the final price.</p><p class="placeholder">☐ Add another check and its expected result.</p>',gherkin:'<h3>Feature</h3><p>Checkout validation</p><h4>Scenario</h4><p>A customer completes checkout with a valid address</p><p><strong>Given</strong> a customer has an item in their cart</p><p><strong>When</strong> they submit a valid delivery address</p><p><strong>Then</strong> they can continue to payment</p>',charters:'<h3>Mission</h3><p class="placeholder">Explore checkout to discover risks.</p><h4>Scope</h4><p class="placeholder">Areas and behaviors to explore.</p><h4>Risks</h4><p class="placeholder">What could fail?</p><h4>Setup and test data</h4><p class="placeholder">Accounts, environment, and data.</p><h4>Timebox</h4><p class="placeholder">Duration of the exploration.</p><h4>Observations</h4><p class="placeholder">Record what you find.</p>',coverage_outline:'<h3>Coverage map</h3><p class="placeholder">Group the areas and risks to cover.</p><h4>Concrete cases</h4><ul><li class="placeholder">Behavior, steps, and expected result.</li></ul>',structured:'<h3>Environment</h3><p>macOS · Safari · Staging</p><h4>Steps to reproduce</h4><ol><li>Add a product to the cart.</li><li>Continue to checkout and leave the postcode empty.</li><li>Select Continue to payment.</li></ol><h4>Expected result</h4><p>The postcode is required. An inline error explains how to continue.</p><h4>Actual result</h4><p>Checkout continues without a postcode.</p><h4>Evidence</h4><p class="placeholder">Add a screenshot or supporting details.</p><h4>Impact</h4><p class="placeholder">Describe the effect on the customer.</p>',blank:'<p class="placeholder">Write your finding…</p>'};
const state={view:'testcase',format:'qa_cases',findingFormat:'structured',authored:false,attachment:true,sent:false,message:'Checkout accepts an empty postcode. Help me describe the expected result.',sentMessage:''};
const params=new URLSearchParams(location.search);if(['testcase','finding','chat'].includes(params.get('view')))state.view=params.get('view');if(params.get('theme')==='light')document.documentElement.dataset.theme='light';
function toolbar(){return '<div class="toolbar"><button>Paragraph ⌄</button><button aria-label="Bold"><b>B</b></button><button aria-label="Italic"><i>I</i></button><button aria-label="Bulleted list">☷</button><button aria-label="Checklist">☑</button><button aria-label="Link">↗</button><button aria-label="Upload image">'+icon.image+'</button></div>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===state.view));document.getElementById('theme').textContent=document.documentElement.dataset.theme==='dark'?'Light theme':'Dark theme';const finding=state.view==='finding';document.getElementById('screen').innerHTML=state.view==='chat'?chat():`<div class="heading"><div><p class="eyebrow">${finding?'Findings':'Test cases'}</p><h1>${finding?'Issues and risks':'Test cases'}</h1><p>Session · Checkout validation</p></div><div class="buttons"><button class="primary">＋ Create ${finding?'finding':'test cases'}</button><button>✧ Generate with AI</button></div></div><div class="filters"><div class="search">⌕ &nbsp; Search ${finding?'findings':'test cases'}…</div><button><span class="muted">Sort</span> Recently updated ⌄</button><small>${finding?'1 finding':'2 test case records'}</small></div><div class="collection"><div class="master"><div class="record chosen"><strong>New ${finding?'finding':'test cases'}</strong><small>Draft, not saved yet</small></div><div class="record"><strong>${finding?'Delivery address is not validated':'Complete checkout'}</strong><small>Updated today, 09:42</small><span class="badge">${finding?'Bug':'QA cases'}</span></div>${finding?'':'<div class="record"><strong>Cart quantity updates</strong><small>Updated today, 09:15</small><span class="badge">Checklist</span></div>'}</div><article class="editor"><div class="editor-title"><h2>New ${finding?'finding':'test cases'}</h2><span>Draft, not saved yet</span></div><div class="record-actions"><button>${icon.copy} Copy</button><button class="quiet">${icon.close} Cancel</button><button class="primary">${icon.save} Save ${finding?'finding':'test cases'}</button></div><label class="field">Title<input value="${finding?'Checkout accepts an empty postcode':'Checkout validation'}" aria-label="${finding?'Finding':'Test case'} title"></label>${finding?'<div class="finding-fields"><label class="field">Finding type<select><option>Bug</option><option>Question</option><option>Risk</option><option>Follow-up</option><option>Note</option></select></label><label class="field">Severity<select><option>Medium</option><option>High</option><option>Low</option><option>Unknown</option></select></label><label class="field">Status<select><option>Open</option><option>In progress</option><option>Resolved</option></select></label></div>':''}<div class="format-row"><label class="field">${finding?'Template':'Output format'}<select id="format" aria-label="${finding?'Finding template':'Test case output format'}">${(finding?[['structured','Structured finding'],['blank','Blank']]:formats).map(([id,label])=>`<option value="${id}" ${id===(finding?state.findingFormat:state.format)?'selected':''}>${label}</option>`).join('')}</select></label><p>${finding?'The same sections used in generated findings.':'The same formats used when generating test cases.'}<br>Choose a structure, then fill it in yourself.</p></div>${toolbar()}<div class="body-editor" contenteditable="true" role="textbox" aria-label="Draft body">${starters[finding?state.findingFormat:state.format]}</div><div class="optional"><h3>Start with your Note, if useful</h3><p>Ordinary writing works without AI. Source actions use the latest saved Note.</p><div class="buttons"><button>▤ Prefill from note</button><button>✧ Generate with AI</button></div></div></article></div>`;const select=document.getElementById('format');if(select)select.onchange=()=>{if(state.authored){document.getElementById('modal').innerHTML='<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="replace-title"><h2 id="replace-title">Replace the draft structure?</h2><p>Your current body contains changes. Applying another format replaces the body. Your title and finding details stay as they are.</p><div class="buttons"><button id="keep">Keep editing</button><button class="primary" id="replace">Apply format</button></div></section></div>';document.getElementById('keep').onclick=()=>{document.getElementById('modal').innerHTML='';select.value=finding?state.findingFormat:state.format};document.getElementById('replace').onclick=()=>{state[finding?'findingFormat':'format']=select.value;state.authored=false;document.getElementById('modal').innerHTML='';render()}}else{state[finding?'findingFormat':'format']=select.value;render()}};const body=document.querySelector('.body-editor');if(body)body.oninput=()=>state.authored=true;document.getElementById('remove-attachment')?.addEventListener('click',()=>{state.attachment=false;render()});document.getElementById('attach')?.addEventListener('click',()=>document.getElementById('file').click());document.getElementById('file')?.addEventListener('change',()=>{state.attachment=true;render()});document.getElementById('send')?.addEventListener('click',()=>{state.sentMessage=state.message;state.message='';state.sent=true;state.attachment=false;render()});const message=document.getElementById('message');if(message){message.value=state.message;message.addEventListener('input',event=>{state.message=event.target.value})}const sentMessage=document.getElementById('sent-message');if(sentMessage)sentMessage.textContent=state.sentMessage;document.getElementById('message')?.addEventListener('paste',event=>{if(Array.from(event.clipboardData.items).some(x=>x.type.startsWith('image/'))){event.preventDefault();state.attachment=true;render()}})}
function chat(){return `<div class="chatmode"><button>Write note</button><button class="active">Chat</button></div><section class="chat-card"><h1>Checkout validation</h1><div class="chat-topline"><div><h2>Conversation</h2><p>Gather testing information, then add the saved conversation to your Session Note.</p></div><button class="small">Start new conversation</button></div><div class="chat-meta"><span>Next invocation · Codex CLI · CLI default</span><span class="saved">${icon.check} Conversation saved</span><button class="small">Configure AI</button></div><div class="transcript"><div class="message"><span class="avatar">Y</span><div><strong>You</strong><p>I’m testing validation in the checkout flow. What should I look for?</p></div></div><div class="message"><span class="avatar ai">✧</span><div><strong>Assistant</strong><p>Check required fields, invalid postcodes, and whether errors keep the entered address. Share a screenshot and I can help review the behavior.</p></div></div>${state.sent?'<div class="message"><span class="avatar">Y</span><div><strong>You</strong><p id="sent-message"></p><img class="sent-img" alt="Attached checkout screenshot" src="evidence.png"><p class="muted small">Design preview only. No AI request was sent.</p></div></div>':''}</div><p class="chat-count">${state.sent?'3':'2'} / 128 messages · 0.4 / 128 KiB transcript</p><div class="modelrow"><span>⚙</span><div class="label"><span>Next invocation · Codex CLI</span><strong>Model &nbsp; CLI default · gpt-6.1-sol ⌄</strong></div><span class="spacer"></span></div><div class="handoff"><span>Your existing Note stays intact. Add the saved conversation when you are ready.</span><button class="small">Add conversation to note</button></div><div class="compose"><label for="message">Message</label><div class="compose-box">${state.attachment?`<div class="attachments"><div class="attachment"><img src="evidence.png" alt="Preview of checkout screenshot"><div><strong>checkout-validation.png</strong><small>PNG · Ready to send</small></div><button id="remove-attachment" aria-label="Remove checkout-validation.png">${icon.close}</button></div></div>`:''}<textarea id="message" placeholder="Describe your testing context or ask a question"></textarea></div><div class="compose-actions"><p>Paste an image with Ctrl/Cmd + V.<br>Ctrl/Cmd + Enter to send.</p><div class="buttons"><input id="file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"><button id="attach" class="paperclip" aria-label="Attach images" title="Attach images">${icon.clip}</button><button id="send" class="primary">Send</button></div></div><p class="compose-help">${state.attachment?'This image will be sent to the selected AI provider with your message.':'Enter for a new line. You can also attach a screenshot.'}</p></div></section>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.authored=false;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.view=b.dataset.tab;render()});document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';render()};render();
</script></body></html>
