:root {
  font-family:
    "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv01", "ss03";


  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-md: 13px;
  --font-size-lg: 15px;
  --font-size-xl: 17px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --leading-tight: 1.25;
  --leading-normal: 1.45;
  --leading-relaxed: 1.6;
  font-size: var(--font-size-md);
  --tracking-tight: -0.01em;
  --tracking-wide: 0.08em;


  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;


  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 999px;


  --control-sm: 28px;
  --control-md: 32px;
  --control-lg: 36px;


  --duration-fast: 150ms;
  --duration-base: 200ms;
  --duration-slow: 300ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);


  --surface-base: #f3f4f6;
  --surface-panel: #f8f9fb;
  --surface-raised: #ffffff;
  --surface-sunken: #f0f2f5;
  --surface-overlay: #ffffff;

  --text-primary: #202631;
  --text-secondary: #535e70;
  --text-tertiary: #626e80;

  --border-subtle: rgba(26, 35, 52, 0.08);
  --border-default: rgba(26, 35, 52, 0.14);
  --border-strong: rgba(26, 35, 52, 0.24);

  --accent: #2456c4;
  --accent-hover: color-mix(in oklab, var(--accent) 88%, #000);
  --accent-tint: color-mix(in oklab, var(--accent) 9%, var(--surface-raised));
  --accent-border: color-mix(in oklab, var(--accent) 36%, var(--border-default));
  --accent-alt: #6d28d9;
  --on-accent: #ffffff;

  --success: #147b3b;
  --success-hover: color-mix(in oklab, var(--success) 88%, #000);
  --success-tint: color-mix(in oklab, var(--success) 10%, var(--surface-raised));
  --warning: #b45309;
  --warning-tint: color-mix(in oklab, var(--warning) 10%, var(--surface-raised));
  --danger: #b91c1c;
  --danger-hover: color-mix(in oklab, var(--danger) 88%, #000);
  --danger-tint: color-mix(in oklab, var(--danger) 8%, var(--surface-raised));

  --action-primary-fill: #2456c4;
  --action-primary-text: #ffffff;
  --action-primary-hover: #1e48a6;
  --action-danger-hover: #9f1818;
  --action-danger-tint: #fbecec;

  --backdrop: rgba(9, 13, 20, 0.4);

  --shadow-sm:
    0 1px 2px rgba(26, 35, 52, 0.06),
    0 0 0 1px rgba(26, 35, 52, 0.04);
  --shadow-md:
    0 4px 12px -2px rgba(26, 35, 52, 0.12),
    0 0 0 1px rgba(26, 35, 52, 0.05);
  --shadow-lg:
    0 24px 48px -12px rgba(26, 35, 52, 0.24),
    0 0 0 1px rgba(26, 35, 52, 0.06);

  color: var(--text-primary);
  background: var(--surface-base);
}

:root[data-theme="dark"] {
  --surface-base: #15171c;
  --surface-panel: #1a1d23;
  --surface-raised: #20242c;
  --surface-sunken: #171a20;
  --surface-overlay: #252a33;

  --text-primary: #e4eaf3;
  --text-secondary: #b0bac9;
  --text-tertiary: #9ca8ba;

  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-default: rgba(255, 255, 255, 0.11);
  --border-strong: rgba(255, 255, 255, 0.18);

  --accent: #5b93ff;
  --accent-hover: color-mix(in oklab, var(--accent) 88%, #fff);
  --accent-tint: color-mix(in oklab, var(--accent) 15%, var(--surface-panel));
  --accent-border: color-mix(in oklab, var(--accent) 36%, var(--border-default));
  --accent-alt: #a88fff;
  --on-accent: #0d1219;

  --success: #3fcb7c;
  --success-hover: color-mix(in oklab, var(--success) 88%, #fff);
  --success-tint: color-mix(in oklab, var(--success) 14%, var(--surface-panel));
  --warning: #f3a531;
  --warning-tint: color-mix(in oklab, var(--warning) 14%, var(--surface-panel));
  --danger: #ff7a7a;
  --danger-hover: color-mix(in oklab, var(--danger) 88%, #fff);
  --danger-tint: color-mix(in oklab, var(--danger) 12%, var(--surface-panel));

  --action-danger-hover: #ff9292;
  --action-danger-tint: #3c252b;

  --backdrop: rgba(2, 4, 8, 0.6);

  --shadow-sm: 0 0 0 1px rgba(255, 255, 255, 0.04);
  --shadow-md:
    0 4px 12px -2px rgba(0, 0, 0, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.06);
  --shadow-lg:
    0 24px 48px -12px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(255, 255, 255, 0.08);

  color: var(--text-primary);
  background: var(--surface-base);
}
.app-shell {
  width: 100%;
  min-height: 920px;
  margin: 0;
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  grid-template-rows: 64px 1fr;
  overflow: hidden;
  background: var(--surface-panel);
}

.top-bar {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 208px minmax(0, 560px) minmax(max-content, 1fr);
  align-items: center;
  gap: var(--space-6);
  padding: 0 var(--space-5);
  border-bottom: 1px solid var(--border-default);
  background: var(--surface-raised);
}

.brand-cluster,
.document-status,
.settings-link,
.rail-item,
.select-shell,
.status-pill,
.provider-lines article,
.theme-toggle,
.empty-session-actions {
  display: flex;
  align-items: center;
}

.brand-cluster {
  gap: var(--space-3);
  min-width: 0;
}

.brand-mark {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  color: var(--accent);
}

.brand-cluster strong {
  font-size: var(--font-size-xl);
  letter-spacing: var(--tracking-tight);
}

.global-search {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  height: var(--control-lg);
  padding: 0 var(--space-4);
  color: var(--text-secondary);
  background: var(--surface-raised);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
}

.global-search input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  color: var(--text-primary);
  background: transparent;
}

.global-search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-tint);
}

.top-context-label {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  color: var(--text-secondary);
}

.top-context-label span,
.top-context-label strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-context-label strong {
  flex: 0 0 auto;
  color: var(--text-primary);
}

.top-context-label > span {
  flex: 1 1 auto;
}

.session-context-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-width: 0;
  padding: var(--space-3) var(--space-5) 0;
  background: var(--surface-panel);
  border-bottom: 1px solid var(--border-default);
}

.session-breadcrumb {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  min-width: 0;
  flex: 1 1 0;
  color: var(--text-secondary);
  font-size: var(--font-size-sm);
}

.session-breadcrumb button {
  padding: var(--space-1);
  color: var(--accent);
  background: transparent;
  border: 0;
  cursor: pointer;
}

.session-breadcrumb strong {
  overflow: hidden;
  color: var(--text-primary);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-workspace-tabs {
  display: flex;
  flex: 0 0 auto;
  align-self: end;
  gap: var(--space-1);
  overflow-x: auto;
}

.session-workspace-tabs button {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 42px;
  padding: 0 var(--space-3);
  color: var(--text-secondary);
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.session-workspace-tabs button.active {
  font-weight: 600;
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.session-workspace-tabs button:hover:not(.active) {
  color: var(--text-primary);
  background: var(--surface-sunken);
}

.session-workspace-tabs button span {
  min-width: 22px;
  padding: 1px var(--space-1);
  color: var(--text-secondary);
  font-size: var(--font-size-xs);
  text-align: center;
  background: var(--surface-sunken);
  border-radius: 999px;
}

.workspace-nav {
  display: grid;
  gap: var(--space-1);
}

.contextual-rail {
  min-height: 0;
}

.compact-session-select {
  display: none;
}

.rail-item,
.settings-link {
  width: 100%;
  justify-content: flex-start;
  gap: var(--space-3);
  min-height: var(--control-lg);
  padding: 0 var(--space-3);
  color: var(--text-primary);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
}

.rail-item strong {
  margin-left: auto;
  color: var(--accent);
  font-size: var(--font-size-md);
  font-weight: 600;
}

.rail-item.active,
.settings-link.active {
  color: var(--accent);
  background: var(--accent-tint);
  box-shadow: inset 3px 0 var(--accent);
  font-weight: 600;
}

.rail-item:hover,
.settings-link:hover {
  color: var(--text-primary);
}

.session-picker {
  display: grid;
  gap: var(--space-2);
  padding-top: var(--space-6);
  margin-top: var(--space-6);
  border-top: 1px solid var(--border-default);
}

.library-sidebar {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  gap: var(--space-2);
  padding-top: var(--space-6);
  margin-top: var(--space-6);
  overflow: hidden;
  border-top: 1px solid var(--border-default);
}

.library-sidebar-slot {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
}

.library-sidebar-slot .record-master-list {
  max-height: none;
  padding: 0 2px 0 0;
  background: transparent;
  border: 0;
  border-radius: 0;
}

.rail-heading {
  margin: 0;
  color: var(--text-secondary);
  font-size: var(--font-size-xs);
  font-weight: 600;
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}

.action-button {
  --action-text: var(--text-primary);
  --action-fill: var(--surface-raised);
  --action-hover-fill: var(--surface-sunken);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  gap: var(--space-2);
  min-height: var(--control-lg);
  padding: 0 var(--space-4);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  font-weight: 500;
  line-height: var(--leading-normal);
  color: var(--action-text);
  background: var(--action-fill);
  cursor: pointer;
  scroll-margin: var(--space-2);
}

.action-button--primary {
  --action-text: var(--action-primary-text);
  --action-fill: var(--action-primary-fill);
  --action-hover-fill: var(--action-primary-hover);
  border-color: var(--accent);
  font-weight: 600;
}

.action-button--quiet,
.action-button--destructive-quiet {
  --action-text: var(--text-secondary);
  --action-fill: transparent;
  border-color: transparent;
}

.action-button--destructive-quiet {
  --action-text: var(--danger);
  --action-hover-fill: var(--action-danger-tint);
}

.action-button--destructive-confirmation {
  --action-text: var(--on-accent);
  --action-fill: var(--danger);
  --action-hover-fill: var(--action-danger-hover);
  border-color: transparent;
  font-weight: 600;
}

.action-button:enabled:hover { background: var(--action-hover-fill); }
.action-button--secondary:enabled:hover { border-color: var(--border-strong); }

.action-button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.action-button:disabled { opacity: 1; }
.action-button:disabled:not([aria-busy="true"]) {
  color: var(--text-secondary);
  background: var(--surface-sunken);
  border-color: var(--border-default);
}

.action-button--compact {
  min-height: var(--control-md);
  padding-inline: var(--space-3);
}

.action-button-icon {
  display: inline-flex;
  flex: 0 0 16px;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
}

.action-button svg { width: 16px; height: 16px; flex-shrink: 0; }
.action-button--icon-only { width: var(--control-lg); padding: 0; }
.action-button--icon-only.action-button--compact { width: var(--control-md); }

.settings-save-feedback { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: var(--space-2); max-width: 28rem; }
.settings-save-error { flex-basis: 100%; margin: 0; color: var(--danger); font-size: var(--font-size-sm); line-height: var(--leading-normal); overflow-wrap: anywhere; }
.settings-save-status { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--success); }
.pending-change-discard { margin-right: auto; }

<script>const params=new URLSearchParams(location.search);
const evidence='checkout.png';
const state={scene:params.get('scene')||'compose',layout:params.get('layout')||'side',attached:true,images:[{url:evidence,name:'checkout-validation.png'}],message:'Use this finding and screenshot to draft a Jira story with two subtasks. Show me the draft first.',sent:'',sentImages:[],applied:false,created:false,reply:'',closed:params.get('chat')!=='open',showRequest:false,saved:false,kind:params.get('kind')||'finding',scrollTop:params.get('scroll')==='down'?430:0};
const clip='<svg class="clip-icon" viewBox="0 0 24 24"><path d="m21 11-9 9a6 6 0 0 1-8-8L14 2a4 4 0 0 1 6 6L10 18a2 2 0 0 1-3-3l9-9"/></svg>';
const esc=text=>String(text).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function context(){const item=items[state.kind];return `<div class="context-strip"><div class="row"><div style="min-width:0;flex:1"><small>${state.attached?'In context · '+item.label:'Session context'}</small><strong>${state.attached?item.title:'Checkout validation'}</strong><small>${state.attached?'Latest saved item':'Ask about anything in this Session.'}</small></div>${state.attached?'<button data-action="detach" class="quiet" aria-label="Remove item from context">×</button>':'<button data-action="context" class="quiet">+ Add item</button>'}</div></div>`}

function userMessage(){const images=state.sentImages.length?state.sentImages:(state.scene==='jira'||state.scene==='done'?[{url:evidence,name:'checkout-validation.png'}]:[]);return `<div class="message"><div class="chat-label"><span class="avatar">Y</span>You</div><div class="bubble">${esc(state.sent||'Use this finding and screenshot to draft a Jira story with two subtasks. Show me the draft first.')}${images.map(image=>`<div class="sent-image"><img src="${esc(image.url)}" alt="Screenshot sent with message"><span>${esc(image.name)}</span></div>`).join('')}</div></div>`}
function jiraCard(done=false){return `<div class="tool-card"><div class="tool-title"><span class="jira-icon">◆</span><strong>${done?'Jira issues created':'Jira draft'}</strong><span class="spacer"></span><span class="pill">${done?'3 issues':'Not created yet'}</span></div>${done?'<div class="run-status">✓ Story and both subtasks created · Example result</div>':''}<div class="tool-meta">Project &nbsp; CHECKOUT <span class="muted-divider">·</span> Story + 2 subtasks <span class="muted-divider">·</span> Source finding linked</div><div class="issue"><small><span class="issue-type story">STORY</span>${done?'DEMO-241 · Illustrative key':'Parent issue'}</small><strong>Require a postcode before continuing to payment</strong>${done?'':'<p>Keep the address and show an error for an empty postcode.</p>'}</div><div class="issue subtask"><small><span class="issue-type">SUBTASK</span>${done?'DEMO-242':'Under the story'}</small><strong>Add required postcode validation</strong>${done?'':'<p>Reject empty and whitespace-only values.</p>'}</div><div class="issue subtask"><small><span class="issue-type">SUBTASK</span>${done?'DEMO-243':'Under the story'}</small><strong>Add regression coverage</strong>${done?'':'<p>Test empty, whitespace-only, and valid values.</p>'}</div><div class="tool-actions">${done?'<span class="success-result">✓ 3 of 3 created</span><span class="spacer"></span><span class="theme-tag">Links appear here in the app ↗</span>':'<button class="primary" data-action="create">Create in Jira</button><button class="quiet" data-action="revise-jira">Ask for changes</button>'}</div></div>`}
function refinement(){return `<div class="message"><div class="chat-label"><span class="avatar ai">✧</span>Assistant</div><p class="assistant-text">Here is a clearer expected result. The observed behavior stays as you wrote it.</p><div class="proposal"><div class="proposal-head row">Edit to finding <span class="spacer"></span><small>Expected result</small></div><div class="part"><div class="old">The postcode is required. An inline error explains how to continue.</div><div class="new">Stay on the address step and show “Enter a postcode” beside the empty field. Keep all other address details.</div></div><div class="proposal-foot">${state.applied?'<span class="success">✓ Applied to editor</span><span class="spacer"></span><button data-action="undo">Undo</button>':'<button class="primary" data-action="apply">Apply to finding</button><button class="quiet" data-action="dismiss">Dismiss</button>'}</div></div></div>`}
function transcript(){if(state.scene==='compose')return `<div class="compact-history row"><span>Session conversation</span><span class="spacer"></span><span>Earlier messages ⌄</span></div><div class="message"><div class="chat-label"><span class="avatar ai">✧</span>Assistant</div><div style="margin-left:30px"><h3 class="intro-title">How can I help?</h3><p style="font-size:12px;color:#b8c4d5">Ask questions, work on this item, or ask your agent to take action.</p></div><div class="chat-options"><button data-prompt="refine">Improve wording</button><button data-prompt="jira">Draft Jira issues</button><button data-prompt="gaps">Explore test gaps</button></div><p class="empty-note">You can also paste a screenshot with your message.</p></div>`;if(state.scene==='refine')return `<div class="compact-history">Same conversation · ${state.created?'Jira work created earlier':'Open-ended agent chat'}</div><div class="message"><div class="chat-label"><span class="avatar">Y</span>You</div><div class="bubble">${esc(state.sent||'Can you also make the expected result in the finding more precise?')}</div></div>${refinement()}`;if(state.scene==='general')return `${userMessage()}<div class="message"><div class="chat-label"><span class="avatar ai">✧</span>Assistant</div><p class="assistant-text">${esc(state.reply)}</p></div>`;return `${state.scene==='done'?'<div class="compact-history">Earlier in this conversation · Jira draft reviewed</div>':`<details class="prior-request" ${state.showRequest?'open':''}><summary>You · Story + 2 subtasks · 1 image <span>Show request ⌄</span></summary>${userMessage()}</details>`}<div class="message"><div class="chat-label"><span class="avatar ai">✧</span>Assistant</div><p class="assistant-text">${state.scene==='done'?'Created the story and both subtasks. I linked the source finding. What would you like to do next?':'I drafted a story with two subtasks. Review the scope below, or ask me to change the issue types, project, or wording.'}</p>${jiraCard(state.scene==='done')}</div>${state.scene==='done'?'<div class="chat-options"><button data-prompt="refine">Now improve the finding</button><button data-prompt="gaps">Discuss test coverage</button></div>':''}`}
function composer(){return `<div class="composer"><div class="model"><span>Codex CLI</span><span class="muted-divider">·</span><button>gpt-6.1-sol ⌄</button><span class="spacer"></span><span>Agent tools</span></div><div class="compose-box">${state.images.map((image,index)=>`<div class="image-card"><img src="${esc(image.url)}" alt="Pasted image preview"><div><strong>${esc(image.name)}</strong><small>Ready to send</small></div><button data-action="remove-image" data-index="${index}" aria-label="Remove ${esc(image.name)}">×</button></div>`).join('')}<textarea aria-label="Message" placeholder="Ask a question or ask your agent to do something...">${esc(state.message)}</textarea><div class="compose-actions"><small>⌘ Enter to send</small><span class="spacer"></span><input type="file" id="file" accept="image/*" multiple class="hidden-input"><button class="attach" data-action="attach" aria-label="Attach images">${clip}</button><button class="primary" data-action="send">Send ↑</button></div></div><div class="paste-help">Paste images with ⌘ V · Images go to your selected AI provider.</div></div>`}

function findingBody(){return `<h3>Environment</h3><p>macOS · Safari · Staging</p><h3>Steps to reproduce</h3><ol><li>Add a product to the cart.</li><li>Continue to checkout and leave the postcode empty.</li><li>Select Continue to payment.</li></ol><h3>Expected result</h3><p class="${state.applied?'doc-changed':''}">${state.applied||state.saved?'Stay on the address step and show “Enter a postcode” beside the empty field. Keep all other address details.':'The postcode is required. An inline error explains how to continue.'}</p><h3>Actual result</h3><p>Checkout continues to payment without a postcode.</p><h3>Evidence</h3><p>Reproduced twice in Safari on staging. A screenshot can be shared with the AI in chat.</p><h3>Impact</h3><p>Customers may reach payment with an incomplete delivery address. The effect on order fulfilment needs confirmation.</p><h3>Additional observations</h3><p>All other address fields were populated before selecting Continue to payment. The entered values remained visible when returning to the address step.</p><h3>Checks still to run</h3><ul><li>Try a postcode containing only spaces.</li><li>Repeat the flow with a saved address.</li><li>Check whether validation differs by delivery country.</li><li>Repeat the scenario in Firefox and Chrome.</li></ul><h3>Related test coverage</h3><p>The existing happy path covers a valid delivery address. Required-field validation and whitespace input need additional cases.</p><h3>Open questions</h3><p>Is postcode required for every supported delivery country? Confirm the rule before turning the suggested expected result into an acceptance criterion.</p><h3>Retest notes</h3><p>After a change, confirm that an invalid address keeps the user on the address step and preserves all other entered information.</p>`}
function casesBody(){return `<h3>Scenario</h3><p>A customer enters a delivery address during checkout.</p><h3>TC-01 · Continue with a valid postcode</h3><p><strong>Preconditions</strong> A product is in the cart and checkout is open.</p><ol><li>Enter a complete delivery address.</li><li>Enter a valid postcode.</li><li>Select Continue to payment.</li></ol><p><strong>Expected result</strong> The payment step opens and retains the address.</p><h3>TC-02 · Leave postcode empty</h3><ol><li>Enter the other required address fields.</li><li>Leave postcode empty.</li><li>Select Continue to payment.</li></ol><p><strong>Expected result</strong> Remain on the address step and show an inline postcode error.</p><h3>Test data</h3><p>Use a staging account with no saved delivery addresses.</p><h3>Coverage notes</h3><p>Check country-specific requirements before treating the negative case as a confirmed acceptance criterion.</p><h3>Additional cases to consider</h3><ul><li>Whitespace-only postcode.</li><li>A saved address with no postcode.</li><li>Postcode validation after changing country.</li><li>Returning from payment to edit the address.</li></ul><h3>Execution notes</h3><p>Record the browser, build, delivery country, and exact validation message for each execution.</p>`}

div></section>${state.closed?'':panel()}</div>`;const scroller=document.querySelector('.collection-scroll');if(scroller){scroller.scrollTop=state.scrollTop;scroller.onscroll=()=>{state.scrollTop=scroller.scrollTop;document.querySelector('.item-toolbar')?.classList.toggle('stuck',scroller.scrollTop>=document.querySelector('.collection-intro').offsetHeight)};scroller.onscroll()}

const chatScroll=document.querySelector('.agent-scroll');if(chatScroll&&state.scene==='jira')chatScroll.scrollTop=chatScroll.scrollHeight;
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;state.scrollTop=document.querySelector('.collection-scroll')?.scrollTop||state.scrollTop;if(action==='detach')state.attached=false;if(action==='context'||action==='open'){state.attached=true;state.closed=false}if(action==='close')state.closed=true;if(action==='expand')state.layout=state.layout==='side'?'wide':'side';if(action==='remove-image')state.images.splice(Number(b.dataset.index),1);if(action==='apply')state.applied=true;if(action==='undo'||action==='dismiss')state.applied=false;if(action==='save'&&state.applied){state.saved=true;state.applied=false;state.reply='Sample save completed. The prototype does not persist changes.'}if(action==='attach'){document.getElementById('file').click();return}if(action==='create'){state.scene='done';state.created=true;state.message='';state.images=[]}if(action==='revise-jira'){state.message='Change the story to a bug and keep the two subtasks.'}if(action==='send'){if(!state.message.trim()&&!state.images.length)return;state.sent=state.message;state.sentImages=[...state.images];state.images=[];state.message='';if(/jira|story|subtask/i.test(state.sent))state.scene='jira';else if(/refine|expected result|improve.*finding/i.test(state.sent))state.scene='refine';else{state.scene='general';state.reply='This is a local design preview. Your message and image stay in the conversation. The real app would send this request to your selected coding agent, using its available tools.'}}render()});

document.querySelectorAll('[data-layout]').forEach(button=>button.onclick=()=>{const mode=button.dataset.layout;state.layout='side';state.kind=mode==='cases'?'testware':'finding';state.closed=mode==='top'||mode==='down';state.scrollTop=mode==='down'?430:0;state.scene='compose';state.applied=false;state.message=mode==='cases'?'Use these test cases to draft Jira subtasks under an existing story. Show me the drafts first.':'Use this finding and screenshot to draft a Jira story with two subtasks. Show me the draft first.';state.images=[{url:evidence,name:'checkout-validation.png'}];render()});

const jiraModel={phase:'route',route:null,project:null,parent:null,type:null,component:null,history:[],error:'',created:false};
const jiraProjects={CHECKOUT:{name:'Checkout',types:['Bug','Task','Story'],subtypes:['Subtask','Finding subtask'],components:['Address form','Payment']},PORTAL:{name:'Customer portal',types:['Bug','Task'],subtypes:[],components:[]}};
const jiraParents=[{key:'DEMO-184',title:'Checkout address validation',project:'CHECKOUT',type:'Story'},{key:'DEMO-207',title:'Checkout regression coverage',project:'CHECKOUT',type:'Task'}];
const draftTitle='Checkout accepts an empty postcode';
const originalTranscript=transcript;
function draftPreview(full=false){return `<div class="jira-draft"><div class="draft-label"><span class="jira-icon">◆</span><strong>Jira draft</strong><span class="spacer"></span><small>${jiraModel.created?'Example result':'Not created yet'}</small></div><div class="draft-content"><strong>${draftTitle}</strong>${full?`<p><b>Steps</b> Open checkout, fill the other address fields, leave postcode empty, then continue to payment.</p><p><b>Actual</b> The payment step opens without a postcode.</p><p><b>Expected</b> Show a postcode error and remain on the address step. Confirm which countries require a postcode.</p><p><b>Environment</b> macOS · Safari · Staging</p>`:`<p>Reproduction steps, expected and actual results, and environment drafted from the finding.</p><details><summary>Read draft description</summary><p><b>Steps</b> Open checkout, fill the other address fields, leave postcode empty, then continue to payment.</p><p><b>Actual</b> Payment opens without a postcode.</p><p><b>Expected</b> Show a postcode error and remain on the address step. Confirm which countries require a postcode.</p><p><b>Environment</b> macOS · Safari · Staging.</p></details>`}</div>${jiraModel.project?`<div class="draft-destination"><span>${jiraProjects[jiraModel.project].name} · ${jiraModel.project}</span><span>${jiraModel.type||'Type to choose'}</span>${jiraModel.parent?`<span>Under ${jiraModel.parent.key}</span>`:''}</div>`:''}</div>`}
const jiraChoices=(values,action)=>`<div class="jira-choices">${values.map(value=>`<button data-jira="${action}" data-value="${esc(value)}">${esc(value)}</button>`).join('')}</div>`;
function jiraQuestion(){switch(jiraModel.phase){case 'route':return `<p class="followup-question">How should I create this in Jira?</p><div class="jira-choices route-choices"><button data-jira="route" data-value="new"><strong>New issue</strong><small>Choose a project and issue type</small></button><button data-jira="route" data-value="subtask"><strong>Subtask of an existing issue</strong><small>Choose its parent and subtask type</small></button></div>`;
case 'project':return `<p class="followup-question">Which Jira project should this go into?</p>${jiraChoices(Object.keys(jiraProjects),'project')}<p class="followup-hint">You can also type a project name or key.</p>`;
case 'type':return `<p class="followup-question">Which issue type should I use in ${jiraModel.project}?</p>${jiraChoices(jiraProjects[jiraModel.project].types,'type')}<p class="followup-hint">Available types for this project. Bug fits this finding.</p>`;
case 'parent':return `<p class="followup-question">Which issue should be the parent?</p><div class="parent-search"><input id="parent-search" aria-label="Search Jira parent issues" placeholder="Search by key, title, or paste a Jira link"><button data-jira="search">Search</button></div><div class="parent-results">${jiraParents.map(parent=>`<button data-jira="parent" data-value="${parent.key}"><span class="issue-type story">${parent.type}</span><strong>${parent.key}</strong><span>${parent.title}</span></button>`).join('')}</div><p class="followup-hint">The parent determines the project. These are example search results.</p>`;
case 'subtype':return `<p class="followup-question">Which subtask type should I use?</p><p class="parent-selection">Under <strong>${jiraModel.parent.key}</strong> · ${jiraModel.parent.title}</p>${jiraChoices(jiraProjects[jiraModel.project].subtypes,'type')}<p class="followup-hint">Subtask types available in ${jiraModel.project}. Finding subtask is a custom example.</p>`;
case 'required':return `<p class="followup-question">${jiraModel.project} requires a component for ${jiraModel.type}. Which one?</p>${jiraChoices(jiraProjects[jiraModel.project].components,'component')}<p class="followup-hint">Required by this project for the selected issue type.</p>`;
case 'review':return `<p class="followup-question">The draft is ready. Anything you want to change?</p><div class="review-facts"><span>Type</span><strong>${jiraModel.type}</strong>${jiraModel.parent?`<span>Parent</span><strong>${jiraModel.parent.key} · ${jiraModel.parent.title}</strong>`:''}<span>Component</span><strong>${jiraModel.component||'Not required'}</strong></div><div class="jira-review-actions"><button class="primary" data-jira="create">Create ${jiraModel.route==='subtask'?'subtask':'issue'} in Jira</button><button class="quiet" data-jira="change">Change details</button></div><p class="followup-hint">Creates one ${jiraModel.type.toLowerCase()}${jiraModel.parent?' under '+jiraModel.parent.key:''}. The finding stays unchanged.</p>`;
case 'done':return `<div class="jira-created"><strong>✓ DEMO-241</strong><p>${jiraModel.type} created${jiraModel.parent?' under '+jiraModel.parent.key:''}.</p><small>Simulated result. The real app would show a link to Jira.</small></div><p class="followup-question">What would you like to do next?</p><div class="jira-choices"><button data-prompt="refine">Improve the finding</button><button data-prompt="gaps">Discuss test coverage</button></div>`;}}
transcript=function(){if(state.scene!=='jira')return originalTranscript().replace('Draft Jira issues','Draft Jira issue');return `<div class="compact-history">Same Session conversation · Jira draft</div><details class="prior-request"><summary>You · Draft a Jira issue from this finding</summary>${userMessage()}</details><div class="message jira-message"><div class="chat-label"><span class="avatar ai">✧</span>Assistant</div><p class="assistant-text">${jiraModel.phase==='route'?"I've drafted the finding. Let's choose where it belongs.":jiraModel.phase==='done'?"The Jira action is complete. You can keep chatting here.":"I'm keeping the draft while we choose the Jira details."}</p>${draftPreview(false)}${jiraModel.history.length?`<details class="jira-history"><summary>${jiraModel.history.map(entry=>esc(entry)).join(' · ')} <span>Change</span></summary><button data-jira="change">Choose a different destination or type</button></details>`:''}${jiraQuestion()}${jiraModel.error?`<p class="jira-error">${esc(jiraModel.error)}</p>`:''}</div>`};
function resetJira(){Object.assign(jiraModel,{phase:'route',route:null,project:null,parent:null,type:null,component:null,history:[],error:'',created:false});}
function jiraAction(action,value){jiraModel.error='';switch(action){case 'route':resetJira();jiraModel.route=value;jiraModel.phase=value==='new'?'project':'parent';jiraModel.history=[value==='new'?'New issue':'Subtask'];break;case 'project':jiraModel.project=value;jiraModel.type=null;jiraModel.component=null;jiraModel.phase='type';jiraModel.history=[...jiraModel.history.slice(0,1),value];break;case 'parent':{const parent=jiraParents.find(x=>x.key===value);if(!parent){jiraModel.error='Choose an available parent issue.';break}jiraModel.parent=parent;jiraModel.project=parent.project;jiraModel.phase='subtype';jiraModel.history=['Subtask',parent.key];break}case 'type':jiraModel.type=value;jiraModel.history=[...jiraModel.history.slice(0,2),value];jiraModel.phase=jiraProjects[jiraModel.project].components.length?'required':'review';break;case 'component':jiraModel.component=value;jiraModel.phase='review';jiraModel.history.push(value);break;case 'search':{const text=document.querySelector('#parent-search').value.trim();const match=jiraParents.find(x=>text.toUpperCase().includes(x.key)||x.title.toLowerCase().includes(text.toLowerCase()));if(text&&match){jiraAction('parent',match.key);return}jiraModel.error='No matching parent in this demo. Try DEMO-184 or DEMO-207.';break}case 'create':if(jiraModel.phase!=='review')return;jiraModel.created=true;jiraModel.phase='done';break;case 'change':resetJira();break}render()}
function jiraReply(text){const phase=jiraModel.phase;const lower=text.toLowerCase();if(phase==='route'){if(/subtask|sub-task|under/.test(lower)){jiraAction('route','subtask');return}if(/new|standalone|bug|story|task/.test(lower)){jiraAction('route','new');return}}if(phase==='project'){const project=Object.keys(jiraProjects).find(key=>lower.includes(key.toLowerCase())||lower.includes(jiraProjects[key].name.toLowerCase()));if(project){jiraAction('project',project);return}}if(phase==='parent'){const parent=jiraParents.find(x=>text.toUpperCase().includes(x.key));if(parent){jiraAction('parent',parent.key);return}}if(phase==='type'||phase==='subtype'){const choices=jiraProjects[jiraModel.project][phase==='type'?'types':'subtypes'];const type=[...choices].sort((a,b)=>b.length-a.length).find(x=>lower.includes(x.toLowerCase()));if(type){jiraAction('type',type);return}}if(phase==='required'){const component=jiraProjects[jiraModel.project].components.find(x=>lower.includes(x.toLowerCase()));if(component){jiraAction('component',component);return}}jiraModel.error='This preview handles the choices shown above. In the app, your agent would answer this message and continue the draft.';render()}
const previousRender=render;
render=function(){previousRender();document.querySelectorAll('[data-jira]').forEach(button=>button.onclick=()=>jiraAction(button.dataset.jira,button.dataset.value));const shortcut=document.querySelector('[data-prompt="jira"]');if(shortcut)shortcut.onclick=()=>{state.message='Draft a Jira issue from this finding. Ask me which issue type to use, or whether to make it a subtask of an existing issue.';render();document.querySelector('textarea').focus()};const send=document.querySelector('[data-action="send"]');if(send){const defaultSend=send.onclick;send.onclick=()=>{if(state.scene==='jira'&&!['done','review'].includes(jiraModel.phase)){const text=state.message.trim();if(!text)return;state.message='';jiraReply(text);return}if(/jira/i.test(state.message)&&state.scene!=='jira')resetJira();defaultSend()}}};
function showJiraScene(phase){resetJira();state.scene='jira';state.closed=false;state.layout='side';state.message='';state.images=[];state.sent='Draft a Jira issue from this finding. Ask me which issue type to use, or whether to make it a subtask of an existing issue.';state.scrollTop=430;if(['parent','subtype','required','review','done'].includes(phase))jiraAction('route','subtask');if(['subtype','required','review','done'].includes(phase))jiraAction('parent','DEMO-184');if(['required','review','done'].includes(phase))jiraAction('type','Finding subtask');if(['review','done'].includes(phase))jiraAction('component','Address form');if(phase==='done')jiraAction('create');if(phase==='standalone'){jiraAction('route','new');jiraAction('project','CHECKOUT')}render()}
document.querySelectorAll('[data-jira-view]').forEach(button=>button.onclick=()=>showJiraScene(button.dataset.jiraView));
state.message='';state.images=[];state.closed=false;
if(params.has('jira'))showJiraScene(params.get('jira'));else render();
